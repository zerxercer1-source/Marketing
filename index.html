<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Centered</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .video-wrapper {
            width: 60%;
            height: 80%;
            max-width: 1000px;
            max-height: 700px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsive per mobile */
        @media (max-width: 768px) {
            .video-wrapper {
                width: 90%;
                height: 60%;
            }
        }
    </style>
</head>

<body>

<div class="video-wrapper">
    <video autoplay muted loop playsinline controls>
        <source src="Example.mp4" type="video/mp4">
        Il tuo browser non supporta il video.
    </video>
</div>

</body>
</html>
