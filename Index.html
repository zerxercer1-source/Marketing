<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Fullscreen</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* riempie lo schermo senza distorsioni */
        }

        /* Overlay opzionale per testo sopra il video */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            background: rgba(0,0,0,0.2);
            text-align: center;
        }

        .overlay h1 {
            font-size: 3rem;
        }

        @media (max-width: 768px) {
            .overlay h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

<div class="video-container">
    <video autoplay muted loop playsinline>
        <source src="Example.mp4" type="video/mp4">
        Il tuo browser non supporta il video.
    </video>

    <!-- Testo sopra il video (opzionale) -->
    <div class="overlay">
        <h1>Benvenuto</h1>
    </div>
</div>

</body>
</html>
